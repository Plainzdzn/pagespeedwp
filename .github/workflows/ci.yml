name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer lint

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: imagick
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: Syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: composer test

  integration:
    name: Integration (WordPress, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none
      - name: Umwandeln, Rückgängig, Originale löschen, HEIC, gemeinsame Dateien, Einbettungen (GD)
        run: bin/integration-sqlite.sh

  integration-imagick:
    name: Integration (WordPress, SQLite, Imagick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, imagick, pdo_sqlite, sqlite3
          coverage: none
      - name: Imagick mit WebP vorhanden
        run: |
          php -r 'exit( extension_loaded( "imagick" ) && Imagick::queryFormats( "WEBP" ) ? 0 : 1 );'
      - name: PNG-Transparenz, Rundlauf, HEIC, gemeinsame Dateien, Einbettungen (Imagick)
        env:
          AKWU_TESTS: png-transparency encoder-guards roundtrip heic-alias embeds alias-guards
        run: bin/integration-sqlite.sh

